<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="antigravity-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="100" height="100" rx="22" fill="#09090D" stroke="#1E293B" stroke-width="3" />
  
  <!-- Floating Antigravity Diamond / Cube Base -->
  <path d="M50 16 L80 32 L50 48 L20 32 Z" fill="url(#antigravity-grad)" opacity="0.95" />
  <path d="M20 32 L50 48 L50 82 L20 66 Z" fill="#0052CC" opacity="0.85" />
  <path d="M80 32 L50 48 L50 82 L80 66 Z" fill="#003D99" opacity="0.95" />

  <!-- CLI Prompt Symbol '>_' Overlay -->
  <path d="M36 50 L46 56 L36 62" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="52" y1="62" x2="64" y2="62" stroke="#00D2FF" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
</svg>
